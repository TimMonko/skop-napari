name: napari-skopkit
display_name: scikit-ops

# NB: four widgets, and that there is more than one is the point. napari nests a plugin's
# widgets under its own name only when the plugin contributes more than one --
# with a single widget the entry sits flat as "scikit-ops: Ops". So this is
# what produces Plugins > scikit-ops > {Ops, Workflows, Record, Replay}.
#
# None of them names an op. A per-workflow menu item would mean this manifest
# holding function names that live in the other repository, where a rename
# would silently break the menu; the workflow is chosen inside the panel
# instead, from whatever discovery finds.
contributions:
  commands:
    - id: napari-skopkit.ops_panel
      title: Ops
      python_name: napari_skopkit._panel:OpsPanel
    - id: napari-skopkit.workflows_panel
      title: Workflows
      python_name: napari_skopkit._panel:WorkflowsPanel
    - id: napari-skopkit.record_panel
      title: Record
      python_name: napari_skopkit._record:RecordPanel
    - id: napari-skopkit.replay_panel
      title: Replay
      python_name: napari_skopkit._replay:ReplayPanel
  widgets:
    - command: napari-skopkit.ops_panel
      display_name: Ops
    - command: napari-skopkit.workflows_panel
      display_name: Workflows
    - command: napari-skopkit.record_panel
      display_name: Record
    - command: napari-skopkit.replay_panel
      display_name: Replay
