[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skop-napari"
version = "0.1.0.dev0"
description = "Run scikit-ops ops from napari."
license = "BSD-2-Clause"
authors = [{name = "scikit-ops developers"}]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

requires-python = ">=3.12"
dependencies = [
    "scikit-ops",
    # Helpers for boxes and masks, from scikit-ops' repo.
    "ophelper",
    # The runner, from scikit-ops' repo.
    "oprunner",
    "napari>=0.5",
    "magicgui>=0.8",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    # napari's own pytest fixtures (make_napari_viewer) plus a Qt binding.
    # NB: PyQt6 rather than PyQt5, which ships no Apple Silicon wheels.
    "napari[testing,pyqt6]",
]

[project.entry-points."napari.manifest"]
skop-napari = "skop_napari:napari.yaml"

[project.urls]
homepage = "https://github.com/apposed/skop-napari"
source = "https://github.com/apposed/skop-napari"
tracker = "https://github.com/apposed/skop-napari/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/skop_napari"]

[tool.uv.sources]
# Developed alongside its base package; drop this once scikit-ops is on PyPI.
scikit-ops = { path = "../scikit-ops", editable = true }
ophelper = { path = "../scikit-ops/ophelper", editable = true }
oprunner = { path = "../scikit-ops/oprunner", editable = true }
# Note: the main tip, not the 0.11 release, for PixiInstallMonitor -- it is
# what gives an environment build real progress to show. Matches the pin in
# scikit-ops; both move back to the registry once a release carries it.
#appose = { git = "https://github.com/apposed/appose-python", branch = "main" }
appose = { path = "../appose-python", editable = true }

[tool.ruff]
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["skop", "skop_napari"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
